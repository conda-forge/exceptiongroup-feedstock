schema_version: 1

context:
  name: exceptiongroup
  version: "1.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/exceptiongroup-${{ version }}.tar.gz
  sha256: ca82e69f0cb535fbde934885744b67669a3efddd50fe7bc00d3398839fcaddec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-scm
    - flit-core
  run:
    - python >=${{ python_min }}
    # tightest of upstream's floors (python <3.13)
    # for py <3.13 but let's stay noarch: python
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - exceptiongroup
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Backport of PEP 654 (exception groups)
  license: MIT and PSF-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/exceptiongroup/
  repository: https://github.com/agronholm/exceptiongroup
  documentation: https://docs.python.org/3/library/exceptions.html

extra:
  recipe-maintainers:
    - xylar
